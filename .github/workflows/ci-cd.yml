name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend Build & Verification (Spring Boot)
  # ==========================================
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        working-directory: backend-java
        run: mvn -B test

      - name: Build Backend JAR with Maven
        working-directory: backend-java
        run: mvn -B clean package -DskipTests

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend-java/target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. Frontend Build & Verification (Vite React)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node 20 / React Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 3. Docker Compose Build & Validation
  # ==========================================
  compose-validation:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dummy .env for Compose Validation
        run: cp .env.example .env

      - name: Validate Compose File Syntax
        run: docker compose config

      - name: Build Images via Docker Compose
        run: docker compose build --parallel

  # ==========================================
  # 4. Continuous Deployment (Azure VM)
  # ==========================================
  deploy:
    name: Deploy to Azure Server
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, compose-validation]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'

    steps:
      - name: SSH into Azure VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connecting to Azure VM..."
            cd /home/${{ secrets.SERVER_USER }}/FieldVisit/FeialdVisitManagement || cd ~/FieldVisit/FeialdVisitManagement
            
            echo "📥 Pulling latest changes from git..."
            git pull origin main || git pull origin master
            
            echo "🔨 Rebuilding and starting containers..."
            sudo docker compose up -d --build --remove-orphans
            
            echo "📊 Verifying running containers..."
            sudo docker compose ps
            echo "✅ Deployment completed successfully!"
