# ===================================================================
# Enterprise Field Visit & CRM System - Spring Boot Configuration
# ===================================================================

# Application Server Port (Port 4000 aligns with frontend Vite reverse proxy)
server.port=4000

# Microsoft SQL Server Database Configuration
# Database: field_visit, User: field_user, Password: (blank / no password)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:127.0.0.1}:${DB_PORT:1433};databaseName=${DB_NAME:field_visit};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:field_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT Security
jwt.secret=EnterpriseFieldVisitCRMSecureProductionKey2026EnterpriseFieldVisitCRMSecretKey2026!
jwt.expiration-ms=86400000

# OpenAPI / Swagger Documentation Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
